services:
  mysql:
    image: mysql:8.4
    container_name: leads_mysql
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: leads_db
      MYSQL_ROOT_PASSWORD: wv123
    ports:
      - "3307:3306"
    volumes:
      - leads_mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-uroot", "-pwv123"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  leads_mysql_data:
